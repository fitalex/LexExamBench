name: Validate LexExamBench metadata

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Structure-only diagnostic (empty pilot is not acceptance)
        run: python scripts/validate_index.py --allow-empty
      - run: python -m unittest discover -s tests -v
